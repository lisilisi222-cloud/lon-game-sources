name: Build L0N Native Windows Setup

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-l0n-windows.yml'
      - 'launcher-wpf/bundle/**'
      - 'launcher-wpf/.gitignore'

permissions:
  contents: write

concurrency:
  group: l0n-native-windows-main
  cancel-in-progress: false

jobs:
  build-and-verify:
    runs-on: windows-latest
    timeout-minutes: 50

    steps:
      - name: Checkout L0N repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python for source bundle verification
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate and unpack L0N WPF source
        shell: pwsh
        run: |
          @'
          import base64
          import hashlib
          import io
          import pathlib
          import tarfile

          folder = pathlib.Path("launcher-wpf")
          parts = sorted((folder / "bundle").glob("part*.b64"))
          assert len(parts) == 6, f"Expected 6 source bundle parts, got {len(parts)}"
          data64 = "".join(p.read_text(encoding="ascii").strip() for p in parts)
          assert len(data64) == 22336, "Unexpected source bundle text size"
          archive = base64.b64decode(data64, validate=True)
          digest = hashlib.sha256(archive).hexdigest()
          assert digest == "c6338c105b03f14cb26796196cc908b76303532ffddb83104490eb074bb95a43", f"Source bundle hash mismatch: {digest}"
          with tarfile.open(fileobj=io.BytesIO(archive), mode="r:xz") as tf:
              members = tf.getmembers()
              for item in members:
                  pure = pathlib.PurePosixPath(item.name)
                  assert not pure.is_absolute() and ".." not in pure.parts, "Unsafe archive path"
                  assert item.isfile() or item.isdir(), "Unexpected archive member type"
              tf.extractall(folder, filter="data")
          assert (folder / "L0N.Launcher" / "L0N.Launcher.csproj").is_file()
          assert (folder / "installer" / "L0N.iss").is_file()
          print(f"Verified and unpacked {len(members)} native WPF project entries")
          '@ | python -

      - name: Validate WPF XAML and event references
        working-directory: launcher-wpf
        run: python scripts/verify_source.py

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run L0N Core smoke tests
        working-directory: launcher-wpf
        run: dotnet run --configuration Release --project tests/L0N.Core.SmokeTests/L0N.Core.SmokeTests.csproj

      - name: Compile WPF application
        working-directory: launcher-wpf
        run: dotnet build L0N.Launcher/L0N.Launcher.csproj --configuration Release

      - name: Publish self-contained Windows x64 application
        working-directory: launcher-wpf
        run: dotnet publish L0N.Launcher/L0N.Launcher.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None --output publish

      - name: Test app startup on Windows
        working-directory: launcher-wpf
        shell: pwsh
        run: |
          $exe = (Resolve-Path "publish/L0N.GameLauncher.exe").Path
          $app = Start-Process -FilePath $exe -ArgumentList "--selftest" -PassThru
          if (-not $app.WaitForExit(30000)) {
            Stop-Process -Id $app.Id -Force
            throw "Launcher startup self-test timed out"
          }
          if ($app.ExitCode -ne 0) {
            throw "Launcher startup self-test failed with exit code $($app.ExitCode)"
          }
          Write-Output "PASS: Published native WPF application startup, SQLite and sample catalogues"

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "Failed to install Inno Setup" }
          }
          if (-not (Test-Path $iscc)) { throw "Inno Setup 6 compiler unavailable" }

      - name: Build native L0N installer
        working-directory: launcher-wpf
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\L0N.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compiler failed" }
          if (-not (Test-Path "dist\L0N_Game_Launcher_Setup.exe")) { throw "Installer is missing" }

      - name: Test installer and installed application on Windows
        working-directory: launcher-wpf
        shell: pwsh
        run: |
          $setup = (Resolve-Path "dist/L0N_Game_Launcher_Setup.exe").Path
          $installDir = Join-Path $env:RUNNER_TEMP "L0N CI Install"
          $arguments = "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER /DIR=`"$installDir`""
          $p = Start-Process -FilePath $setup -ArgumentList $arguments -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Installer returned error $($p.ExitCode)" }
          $appPath = Join-Path $installDir "L0N.GameLauncher.exe"
          if (-not (Test-Path $appPath)) { throw "Installed application is missing" }
          $test = Start-Process -FilePath $appPath -ArgumentList "--selftest" -PassThru
          if (-not $test.WaitForExit(30000)) {
            Stop-Process -Id $test.Id -Force
            throw "Installed application self-test timed out"
          }
          if ($test.ExitCode -ne 0) { throw "Installed app failed self-test $($test.ExitCode)" }
          Write-Output "PASS: Silent installation and installed app self-test"

      - name: Commit readable source code after verified build
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A launcher-wpf
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) {
            git commit -m "Publish validated L0N native WPF source files"
            if ($LASTEXITCODE -ne 0) { throw "Could not commit source" }
            git pull --rebase origin main
            if ($LASTEXITCODE -ne 0) { throw "Could not rebase generated source commit" }
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { throw "Could not publish readable source" }
          } else {
            Write-Output "Readable source files already in repository"
          }

      - name: Save build file hashes
        working-directory: launcher-wpf
        shell: pwsh
        run: |
          Get-FileHash "dist/L0N_Game_Launcher_Setup.exe" -Algorithm SHA256 | Format-List
          Get-FileHash "publish/L0N.GameLauncher.exe" -Algorithm SHA256 | Format-List

      - name: Upload unsigned Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: L0N-Windows-Setup-UNSIGNED
          path: launcher-wpf/dist/L0N_Game_Launcher_Setup.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned native Portable
        uses: actions/upload-artifact@v4
        with:
          name: L0N-Windows-Portable-UNSIGNED
          path: launcher-wpf/publish/**
          if-no-files-found: error
          retention-days: 14
